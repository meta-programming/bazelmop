syntax = "proto3";

package bazelmop.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/meta-programming/bazelmop/gen/bazelmop/v1;bazelmopv1";

// BazelmopService is the bazelmop daemon's API. The web dashboard calls it
// with the Connect JSON protocol; Go clients can use gRPC.
service BazelmopService {
  // GetStatus returns what the daemon is doing now and its latest report.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // WatchStatus sends the current status, then a new one each time it
  // changes, until the client disconnects.
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);

  // ListOutputBases returns the output bases and repository caches found
  // under the cache root by the latest scan.
  rpc ListOutputBases(ListOutputBasesRequest) returns (ListOutputBasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListRuns returns recent deduplication runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteOutputBases removes output bases from disk. Only callers on the
  // same machine may use it.
  rpc DeleteOutputBases(DeleteOutputBasesRequest) returns (DeleteOutputBasesResponse);
}

// DaemonStatus is a snapshot of the daemon.
message DaemonStatus {
  // What the daemon is doing, such as "Idle" or "Hashing files: 10/20".
  string activity = 1;
  // When the latest deduplication report was produced. Unset before the
  // first run finishes.
  google.protobuf.Timestamp report_time = 2;
  // When the next run is scheduled to start.
  google.protobuf.Timestamp next_run_time = 3;
  // The latest deduplication report, as Markdown.
  string report_markdown = 4;
  // When the list returned by ListOutputBases last changed. A client that
  // shows output bases fetches them again when this changes.
  google.protobuf.Timestamp output_bases_update_time = 5;
  // The step the current run is on; RUN_PHASE_IDLE between runs.
  RunPhase phase = 6;
  // Files or inodes done and in total for the current phase. Total is zero
  // when it is not known yet, as during the scan.
  int64 phase_done = 7;
  int64 phase_total = 8;
  // When the current run and phase started. Unset when idle.
  google.protobuf.Timestamp run_start_time = 9;
  google.protobuf.Timestamp phase_start_time = 10;
  // Memory charged to the daemon's cgroup. Unset if it cannot be read.
  MemoryUsage memory = 11;
  // The filesystem holding the cache root. Unset if it cannot be read.
  DiskUsage disk = 12;
}

// RunPhase is a step of a deduplication run.
enum RunPhase {
  RUN_PHASE_UNSPECIFIED = 0;
  RUN_PHASE_IDLE = 1;
  // Walking the cache root and reading each file's metadata.
  RUN_PHASE_SCAN = 2;
  // Reading where candidate files sit on disk, to recognise clones.
  RUN_PHASE_READ_EXTENTS = 3;
  // Reading and hashing the files that may be duplicates.
  RUN_PHASE_HASH = 4;
  // Replacing duplicates with reflinks or hard links.
  RUN_PHASE_LINK = 5;
}

// MemoryUsage is the memory charged to the daemon's cgroup v2 group.
message MemoryUsage {
  // Everything charged to the group.
  int64 current_bytes = 1;
  // The group's memory.high and memory.max limits; zero means no limit.
  int64 high_bytes = 2;
  int64 max_bytes = 3;
  // Process memory such as the Go heap.
  int64 anon_bytes = 4;
  // Page cache.
  int64 file_bytes = 5;
  // Kernel memory, mostly the filesystem's inode and directory caches.
  int64 kernel_bytes = 6;
  // How often the group went over high_bytes and the kernel reclaimed
  // memory from it.
  int64 high_events = 7;
}

// DiskUsage is the size of a filesystem and the space left on it.
message DiskUsage {
  string path = 1;
  int64 total_bytes = 2;
  // Space an unprivileged user can still write.
  int64 free_bytes = 3;
}

message ListRunsRequest {
  // Most runs to return; zero returns 20.
  int32 limit = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

// RunOutcome is how a run ended.
enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  RUN_OUTCOME_RUNNING = 1;
  RUN_OUTCOME_COMPLETED = 2;
  RUN_OUTCOME_FAILED = 3;
  // The daemon stopped before the run finished, for example because it
  // was killed.
  RUN_OUTCOME_INTERRUPTED = 4;
}

// Run is one deduplication run.
message Run {
  string id = 1;
  google.protobuf.Timestamp start_time = 2;
  // Unset while running or if interrupted.
  google.protobuf.Timestamp end_time = 3;
  RunOutcome outcome = 4;
  // Why the run failed.
  string error = 5;
  int64 files_scanned = 6;
  int64 files_hashed = 7;
  int64 links_created = 8;
  int64 links_failed = 9;
  // Total size of every scanned file, counted once per path.
  int64 apparent_bytes = 10;
  // How much of apparent_bytes was already stored once, because paths
  // shared an inode or extents, when the run started.
  int64 shared_bytes = 11;
  // Size of the duplicates the run found.
  int64 reclaimable_bytes = 12;
  // Highest memory charged to the daemon's cgroup during the run.
  int64 peak_memory_bytes = 13;
  // Free space on the cache filesystem when the run ended.
  int64 disk_free_bytes = 14;
}

message GetStatusRequest {}

message GetStatusResponse {
  DaemonStatus status = 1;
}

message WatchStatusRequest {}

message WatchStatusResponse {
  DaemonStatus status = 1;
}

// OutputBaseKind says what a directory under the cache root holds.
enum OutputBaseKind {
  OUTPUT_BASE_KIND_UNSPECIFIED = 0;
  // A Bazel output base for one workspace.
  OUTPUT_BASE_KIND_OUTPUT_BASE = 1;
  // The repository cache shared by output bases.
  OUTPUT_BASE_KIND_REPOSITORY_CACHE = 2;
}

// OutputBase is one directory under the cache root.
message OutputBase {
  // The output base's MD5 directory name, or the repository cache's
  // directory name.
  string id = 1;
  OutputBaseKind kind = 2;
  // Absolute path of the directory.
  string path = 3;
  // The workspace the output base belongs to. Empty for a repository cache
  // or when it cannot be determined.
  string workspace_path = 4;
  // Whether workspace_path still exists on disk.
  bool workspace_exists = 5;
  // Apparent size of all files, in bytes. Files shared with other output
  // bases are counted in full.
  int64 size_bytes = 6;
  int64 file_count = 7;
  // Latest modification time of any file.
  google.protobuf.Timestamp last_modified_time = 8;
  // Latest build or Bazel server start. Unset if never seen.
  google.protobuf.Timestamp last_build_time = 9;
  // Latest test log or result. Unset if never seen.
  google.protobuf.Timestamp last_test_time = 10;
}

message ListOutputBasesRequest {}

message ListOutputBasesResponse {
  repeated OutputBase output_bases = 1;
}

message DeleteOutputBasesRequest {
  // IDs as returned in OutputBase.id.
  repeated string ids = 1;
}

message DeleteOutputBasesResponse {
  repeated string deleted_ids = 1;
  repeated DeleteFailure failures = 2;
}

// DeleteFailure says why one output base was not deleted.
message DeleteFailure {
  string id = 1;
  string message = 2;
}
